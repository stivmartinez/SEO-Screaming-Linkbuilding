name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach builds to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build desktop app
        run: |
          chmod +x scripts/build-desktop.sh
          ./scripts/build-desktop.sh

      - name: Zip macOS app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "SEO Screaming Link Building.app" \
            ../SEO-Screaming-Link-Building-mac-arm64.zip
          ls -lh ../SEO-Screaming-Link-Building-mac-arm64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: SEO-Screaming-Link-Building-mac-arm64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build desktop app
        shell: bash
        run: |
          chmod +x scripts/build-desktop.sh
          ./scripts/build-desktop.sh

      - name: Zip Windows app
        shell: bash
        run: |
          cd dist
          powershell.exe -Command "Compress-Archive -Path 'SEOScreamingLinkBuilding' -DestinationPath '../SEO-Screaming-Link-Building-win-x64.zip' -Force"
          ls -lh ../SEO-Screaming-Link-Building-win-x64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: SEO-Screaming-Link-Building-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
